<!doctype html>
<html lang="fr" data-lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activité contestataire — octobre–novembre 2026</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- type="module" is deferred: the body exists before boot() runs -->
    <script type="module" src="bundle.js"></script>
  </head>
  <body>
    <header class="page-head">
      <p class="kicker" data-i18n="hdr.kicker"></p>
      <h1 data-i18n="hdr.title"></h1>
      <p class="lede" data-i18n="hdr.lede"></p>
      <div
        class="lang-switch"
        data-lang-switch
        role="group"
        aria-label="Langue"
      >
        <button type="button" data-set-lang="fr">FR</button>
        <button type="button" data-set-lang="en">EN</button>
      </div>
    </header>

    <p id="disclaimer" class="disclaimer"></p>

    <section>
      <header id="hdr-a"></header>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-protesters" role="img"></canvas>
        </div>
      </figure>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-enforcement" role="img"></canvas>
        </div>
      </figure>
      <figure class="card">
        <div class="canvas-box tall">
          <canvas id="chart-costs" role="img"></canvas>
        </div>
      </figure>
    </section>

    <section>
      <header id="hdr-b"></header>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-protesters-weekly" role="img"></canvas>
        </div>
      </figure>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-enforcement-weekly" role="img"></canvas>
        </div>
      </figure>
    </section>

    <section>
      <header id="hdr-c"></header>
      <p id="note-c" class="axis-note"></p>
      <div id="trellis-episodes" class="trellis"></div>
      <h3 class="legend-title" data-i18n="leg.items.title"></h3>
      <div id="legend-items" class="legend"></div>
    </section>

    <section>
      <header id="hdr-cp"></header>
      <p id="note-cp" class="axis-note"></p>
      <div id="trellis-items" class="trellis"></div>
      <h3 class="legend-title" data-i18n="leg.movements.title"></h3>
      <div id="legend-events" class="legend"></div>
    </section>

    <section id="sources">
      <!-- was <h1>: the page h1 is in the header. Kept outside the replaced area
           by sources.ts, which preserves leading headings. -->
      <h2 class="sources-title">Sources</h2>
    </section>
  </body>
</html>
