<!doctype html>
<html lang="fr" data-lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activité contestataire — octobre–novembre 2026</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- type="module" is deferred: the body exists before boot() runs -->
    <script type="module" src="bundle.js"></script>
  </head>
  <body>
    <header class="page-head">
      <p class="kicker" data-i18n="hdr.kicker"></p>
      <h1 data-i18n="hdr.title"></h1>
      <p class="lede" data-i18n="hdr.lede"></p>
      <div class="head-tools">
        <div
          class="lang-switch"
          data-lang-switch
          role="group"
          aria-label="Langue"
        >
          <button type="button" data-set-lang="fr">FR</button>
          <button type="button" data-set-lang="en">EN</button>
        </div>
        <a
          class="repo-link"
          id="repo-link"
          href="https://github.com/y1DWgTh1oTZIG/french-protest-charts"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Code source sur GitHub"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
        </a>
      </div>
    </header>

    <p id="disclaimer" class="disclaimer"></p>

    <section>
      <header id="hdr-a"></header>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-protesters" role="img"></canvas>
        </div>
      </figure>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-enforcement" role="img"></canvas>
        </div>
      </figure>
      <figure class="card">
        <div class="canvas-box tall">
          <canvas id="chart-costs" role="img"></canvas>
        </div>
      </figure>
    </section>

    <section>
      <header id="hdr-b"></header>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-protesters-weekly" role="img"></canvas>
        </div>
      </figure>
      <figure class="card">
        <div class="canvas-box">
          <canvas id="chart-enforcement-weekly" role="img"></canvas>
        </div>
      </figure>
    </section>

    <section>
      <header id="hdr-c"></header>
      <p id="note-c" class="axis-note"></p>
      <div id="trellis-episodes" class="trellis"></div>
      <h3 class="legend-title" data-i18n="leg.items.title"></h3>
      <div id="legend-items" class="legend"></div>
    </section>

    <section>
      <header id="hdr-cp"></header>
      <p id="note-cp" class="axis-note"></p>
      <div id="trellis-items" class="trellis"></div>
      <h3 class="legend-title" data-i18n="leg.movements.title"></h3>
      <div id="legend-events" class="legend"></div>
    </section>

    <section id="sources">
      <!-- was <h1>: the page h1 is in the header. Kept outside the replaced area
           by sources.ts, which preserves leading headings. -->
      <h2 class="sources-title">Sources</h2>
    </section>
  </body>
</html>
